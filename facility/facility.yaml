# Facility model, schema v1 (ARCHITECTURE-SPINE AD-2, AD-14).
# The single authored source for pipes, sensors, pipe attributes, data contracts and tunables.
# Parsed only by facility/model.py. Aliases are derived, never authored here.
version: 1
facility: {id: lng1, name: LNG Facility 1}
areas: [train1, train2]

# Default data contract per measurement. Units are fixed by the Conventions unit table.
contracts:
  pressure_in:  {unit: Pa, min: 0, max: 10000000, rate_hz: 1, owner: Process Engineering}
  pressure_out: {unit: Pa, min: 0, max: 10000000, rate_hz: 1, owner: Process Engineering}
  flow_in:      {unit: kg/s, min: 0, max: 50, rate_hz: 1, owner: Process Engineering}
  flow_out:     {unit: kg/s, min: 0, max: 50, rate_hz: 1, owner: Process Engineering}
  temperature:  {unit: K, min: 50, max: 400, rate_hz: 1, owner: Instrumentation}
  methane_ppm:  {unit: ppmv, min: 0, max: 10000, rate_hz: 1, owner: HSE}


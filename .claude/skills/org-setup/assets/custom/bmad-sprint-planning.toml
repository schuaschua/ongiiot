# Org Kit override (org-setup). Offers Scrooge McDuck's token budgets (a Claude API budget per epic, sprint
# and remaining planning phase) once the sprint plan is done.
[workflow]
on_complete = "The sprint plan is done, so the work ahead can be budgeted. Ask the user once whether Scrooge McDuck (the agent-scrooge skill) should set the Claude API token budgets: a budget in money for each epic, each sprint if they want sprint budgets, and each planning phase still to run (test design, governance, diagrams, course corrections), proposed from the stories and the spend so far, then compared with the actual spend in the token ledger's final summary (token_usage_summary_final.csv) and the cost estimate workbook. If _bmad/memory/agent-scrooge/token-budgets.json already exists, offer instead to review it and add the sprint budgets. Suggest a fresh session (/clear, then 'Scrooge, set the token budgets'); start Scrooge here only on an explicit yes. In headless mode never ask; only mention that the budgets are not set yet."

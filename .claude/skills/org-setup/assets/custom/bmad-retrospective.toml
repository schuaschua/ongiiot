# Org Kit override (org-setup). Asks the end-of-epic AI feedback (Scrooge McDuck's ai_feedback.py) for
# every finished epic the team hasn't rated yet, once the retrospective is done.
[workflow]
on_complete = "First, the end-of-epic AI feedback: run `uv run .claude/skills/agent-scrooge/scripts/ai_feedback.py {project-root} pending` (Scrooge McDuck's script; resolve {project-root} to the project folder). For each epic it lists under pending (a finished epic nobody has rated yet), ask the user, one epic at a time, as a multiple-choice question: 'How would you rate the AI on <epic> (its number and title), from 1 (very poor) to 5 (excellent)?'. Only if the rating is 1 or 2 (poor), ask a second question, allowing more than one answer: 'What went wrong?' with the options AI coding standard not up to quality; AI testing standards not up to quality; AI decision-making was flawed; AI answers were not grounded in company data; Poor AI security / compliance suggestions; Other (please specify), and for Other ask what it was. Record the answer with `... ai_feedback.py {project-root} record --epic <n> --rating <1-5>` plus, for a poor rating, one `--category` per answer (coding, testing, decisions, grounding, security, other) and `--other '<their words>'` for Other. If the user declines to rate, record it with `--skip` so they are not asked again. If the script answers invalid, fix the answer from its errors (ask again if needed) and record it. Say nothing about feedback when nothing is pending; in headless mode never ask, only mention the epics waiting to be rated."

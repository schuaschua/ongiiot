# Org Kit override (org-setup). Org story structure and Jira sync, then Scrooge McDuck's token budgets.
[workflow]
persistent_facts = [
  "Break epics into a hybrid structure: setup work gets separate stories per layer (Terraform + git, CI/CD, FastAPI, React, monitoring); feature stories stay end-to-end with a **Tasks:** list after the acceptance criteria, one task per layer (Terraform, FastAPI, React, tests). Tasks become Jira Subtasks.",
]
on_complete = "Offer to sync the epics and stories to Jira project {jira_project_key} ({jira_site}) through the Atlassian MCP server: show the full list of issues to create or update, create or update only after explicit approval, update existing issues instead of creating duplicates, and use Epic → Story → Subtask with story ids in summaries and FR/AD/UX-DR ids as labels. Then, only if _bmad/memory/agent-scrooge/token-budgets.json does not exist yet, ask the user once whether Scrooge McDuck (the agent-scrooge skill) should set the Claude API token budgets now that the epics are known: a budget in money for each epic and each planning phase still to run (test design, governance, diagrams, course corrections), compared with the actual spend in the token ledger's final summary and the cost estimate. Say it can also wait until after sprint planning, when sprint budgets can be added too. Suggest a fresh session (/clear, then 'Scrooge, set the token budgets'); start Scrooge here only on an explicit yes."

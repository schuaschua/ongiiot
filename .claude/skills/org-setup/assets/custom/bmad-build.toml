# Org Kit override (org-setup). Loads the org and project standards as persistent facts, and offers
# the end-of-epic AI feedback for every finished epic, and Scrooge McDuck's project close-out once every
# epic and story is done.
[workflow]
persistent_facts = [
  "file:{standards_glob}",
]
on_complete = "First, the end-of-epic AI feedback: run `uv run .claude/skills/agent-scrooge/scripts/ai_feedback.py {project-root} pending` (Scrooge McDuck's script; resolve {project-root} to the project folder). For each epic it lists under pending (a finished epic nobody has rated yet), ask the user, one epic at a time, as a multiple-choice question: 'How would you rate the AI on <epic> (its number and title), from 1 (very poor) to 5 (excellent)?'. Only if the rating is 1 or 2 (poor), ask a second question, allowing more than one answer: 'What went wrong?' with the options AI coding standard not up to quality; AI testing standards not up to quality; AI decision-making was flawed; AI answers were not grounded in company data; Poor AI security / compliance suggestions; Other (please specify), and for Other ask what it was. Record the answer with `... ai_feedback.py {project-root} record --epic <n> --rating <1-5>` plus, for a poor rating, one `--category` per answer (coding, testing, decisions, grounding, security, other) and `--other '<their words>'` for Other. If the user declines to rate, record it with `--skip` so they are not asked again. If the script answers invalid, fix the answer from its errors (ask again if needed) and record it. Say nothing about feedback when nothing is pending. Then check whether the project's delivery is finished: read the sprint status (_bmad-output/implementation-artifacts/sprint-status.yaml, or wherever the project keeps sprint-status.yaml). Only if every epic and every story in it is done, and the project has not been closed out yet (no estimate model *.estimate.json in the org config's cost_estimates_folder, default docs/costing, has a close_out entry), ask the user once whether Scrooge McDuck (the agent-scrooge skill) should close out the project now: how long it took from the first BMad stage to the last epic, the total Claude API calls and their cost at Claude's list prices, added to the cost estimate workbook for the dashboard. Suggest a fresh session (/clear, then 'Scrooge, close out the project'); start Scrooge here only on an explicit yes. If anything is still open, or the close-out exists, say nothing about it."

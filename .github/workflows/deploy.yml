# Deploys: `poc` on push to main (after tests pass and `poc` environment approval);
# `poc-<initials>` developer stages by manual dispatch (environment `dev`, no approval).
# Every deploy waits for the `test` job; no AWS access before it passes.
# Runbook: docs/ci-cd.md
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: "Developer stage to deploy, poc-<initials> (e.g. poc-dj)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run pytest -q

  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      stage: ${{ steps.out.outputs.stage }}
      environment: ${{ steps.out.outputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - name: Check dispatch stage
        if: github.event_name == 'workflow_dispatch'
        env:
          STAGE: ${{ inputs.stage }}
        run: >-
          uv run python -c 'import os,sys; from facility.model import STAGE_RE; s=os.environ["STAGE"]; sys.exit(0 if s.startswith("poc-") and STAGE_RE.fullmatch(s) else f"refused stage {s!r}: dispatch needs poc-<initials>")'
      - name: Resolve stage and environment
        id: out
        env:
          EVENT: ${{ github.event_name }}
          STAGE: ${{ inputs.stage }}
        run: |
          if [ "$EVENT" = "push" ]; then
            echo "stage=poc" >> "$GITHUB_OUTPUT"
            echo "environment=poc" >> "$GITHUB_OUTPUT"
          else
            echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [test, resolve]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    concurrency:
      group: deploy-${{ needs.resolve.outputs.stage }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      STAGE: ${{ needs.resolve.outputs.stage }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: uv sync --locked
      # Deploy role: trusted only for the `poc` and `dev` environments of this repo.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: npx --yes aws-cdk@2.1143.0 deploy "*-$STAGE" -c "stage=$STAGE" --require-approval never
